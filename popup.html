<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"></head><body><header><div class="logo">♪</div><div><h1>Smart Ping</h1><small>ChatGPT response alerts</small></div><span id="status">ON</span></header><main><label class="toggle"><span>Enable Smart Ping</span><input id="enabled" type="checkbox"></label><hr><h2>When should it ping?</h2><label class="toggle"><span>When I'm away<small>Other tabs or applications</small></span><input id="background" type="checkbox"></label><label class="toggle"><span>Long responses<small>Even while watching ChatGPT</small></span><input id="long" type="checkbox"></label><label class="range"><span>Long response threshold <b id="thresholdValue"></b></span><input id="threshold" type="range" min="10" max="300" step="10"></label><hr><h2>Sound settings</h2><label>Sound<select id="sound"><option value="soft">Soft ping</option><option value="digital">Digital chime</option><option value="bell">Classic bell</option></select></label><label class="range"><span>Volume <b id="volumeValue"></b></span><input id="volume" type="range" min="0" max="100" step="5"></label><button id="test">▶ Test sound</button><hr><label class="toggle"><span>Desktop notifications<small>Show a system notification</small></span><input id="notify" type="checkbox"></label><p id="saved" role="status">Settings save automatically</p></main><script src="popup.js"></script></body></html>
